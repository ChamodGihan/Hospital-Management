/* Contact Section */
.contact-section {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 50px;
  width: 100%;
  height: 100%;
  margin-top: 25px;
}

.contact-container {
  background-color: #fff;
  padding: 30px;
  border-radius: 12px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.15);
  display: flex;
  justify-content: space-between;
  align-items: center;
  width: 80%;
  max-width: 1000px;
  transition: transform 0.3s ease;
}

.contact-container:hover {
  transform: scale(1.05);
}

.form-container {
  width: 55%;
}

.form-container h2 {
  font-size: 28px;
  margin-bottom: 30px;
  font-weight: 500;
}

.input-group {
  display: flex;
  flex-direction: column;
  gap: 15px;
}

.input-group input,
textarea {
  padding: 15px;
  font-size: 16px;
  border: 2px solid #ddd;
  border-radius: 8px;
  margin-bottom: 20px;
  background-color: #f7f7f7;
  color: #333;
  transition: all 0.3s ease;
}

.input-group input:focus,
textarea:focus {
  border-color: #00c6ff;
  outline: none;
  background-color: #fff;
}

textarea {
  resize: vertical;
  min-height: 150px;
}

.submit-btn {
  background-color: #00c6ff;
  border: none;
  color: #fff;
  font-size: 16px;
  padding: 15px;
  border-radius: 8px;
  cursor: pointer;
  transition: background-color 0.3s ease;
}

.submit-btn:hover {
  background-color: #1f1c2c;
}

/* Image Container */
.image-container {
  width: 35%;
  display: flex;
  justify-content: center;
  align-items: center;
}

.image-container img {
  width: 150px;
  height: auto;
  animation: bounce 1.5s ease-in-out infinite;
}

/* Animation */
@keyframes bounce {
  0%, 100% {
      transform: translateY(0);
  }
  50% {
      transform: translateY(-10px);
  }
}

/* Mobile Responsiveness */
@media (max-width: 768px) {
  .contact-container {
      flex-direction: column;
  }

  .form-container {
      width: 100%;
  }

  .image-container {
      display: none;
  }
}
